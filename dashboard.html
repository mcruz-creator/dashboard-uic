<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UIC — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.1"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            go: { primary: '#003366', secondary: '#00874e', bg: '#f8f9fa' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Layout: sidebar + main -->
  <div class="flex min-h-screen">

    <!-- Sidebar -->
    <aside class="sidebar bg-go-primary text-white w-56 flex-shrink-0 flex flex-col sticky top-0 h-screen z-50">
      <div class="flex items-center gap-3 px-4 py-4 border-b border-white/10">
        <img src="assets/logo-go.svg" alt="GO" class="h-9">
        <span class="text-base font-semibold">UIC</span>
      </div>
      <nav class="flex-1 py-3">
        <button class="sidebar-btn active" data-section="home" onclick="switchSection('home')">
          Real vs Proyección
        </button>
        <button class="sidebar-btn" data-section="facturacion" onclick="switchSection('facturacion')">
          Facturación
        </button>
        <button class="sidebar-btn" data-section="produccion" onclick="switchSection('produccion')">
          Producción
        </button>
      </nav>
      <div class="px-4 py-3 border-t border-white/10">
        <button onclick="logout()" class="w-full text-sm bg-white/10 hover:bg-white/20 px-3 py-2 rounded-lg transition">
          Cerrar sesión
        </button>
      </div>
    </aside>

    <!-- Main area -->
    <div class="flex-1 min-w-0">

      <!-- Loading spinner -->
      <div id="loading" class="flex flex-col items-center justify-center py-32">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-go-primary border-t-transparent mb-4"></div>
        <p class="text-gray-500">Cargando datos...</p>
      </div>

      <!-- Error state -->
      <div id="error" class="hidden flex flex-col items-center justify-center py-32">
        <p class="text-red-600 text-lg mb-4">No se pudieron cargar los datos. Verificá tu conexión.</p>
        <button onclick="loadAllData()" class="bg-go-primary text-white px-6 py-2 rounded-lg hover:bg-blue-900 transition">
          Reintentar
        </button>
      </div>

      <!-- Main content (3 sections, only one visible at a time) -->
      <main id="content" class="hidden px-6 py-6">
        <div id="section-home"></div>
        <div id="section-facturacion" class="hidden"></div>
        <div id="section-produccion" class="hidden"></div>
      </main>

    </div><!-- /main area -->
  </div><!-- /layout -->

  <!-- Scripts -->
  <script src="js/auth.js?v=3"></script>
  <script src="js/data.js?v=5"></script>
  <script src="js/charts.js?v=3"></script>
  <script src="js/filters.js?v=3"></script>
  <script src="js/sections/home.js?v=7"></script>
  <script src="js/sections/facturacion.js?v=17"></script>
  <script src="js/sections/produccion.js?v=6"></script>
  <script>
    if (!requireAuth()) throw new Error('Not authenticated');
    loadAllData();
  </script>
</body>
</html>
